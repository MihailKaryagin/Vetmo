<div class="roster-actions"><form method="post" action="{% url 'roster_action' listing.pk 'renew' %}">{% csrf_token %}<button>Продлить набор на неделю</button></form>
{% if listing.game_at and listing.game_at <= now %}<form method="post" action="{% url 'roster_action' listing.pk 'again' %}" data-confirm="Создать новое объявление и пригласить прошлых участников?"><button>Собраться ещё раз</button>{% csrf_token %}</form>{% endif %}
{% if roster|length < 4 %}<form method="post" action="{% url 'roster_action' listing.pk 'replacement' %}">{% csrf_token %}<label>Нужна замена <select name="role">{% for slot in slots %}{% if not slot.member and not slot.captain %}<option>{{ slot.role }}</option>{% endif %}{% endfor %}</select></label><button>Открыть набор на позицию</button></form>{% endif %}</div>
