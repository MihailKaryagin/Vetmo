<div class="hero-pool" aria-label="Любимые герои">
{% for hero in person.hero_portraits %}<span class="hero-chip">{% if hero.image %}<img src="{{ hero.image }}" alt="" width="64" height="36" loading="lazy" referrerpolicy="no-referrer">{% endif %}<span>{{ hero.name }}</span></span>{% empty %}<span>Пул героев пока не указан</span>{% endfor %}
</div>
